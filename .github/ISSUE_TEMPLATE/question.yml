# Question form, listed in the template chooser opened from the app (Settings › About › Feedback).
name: ❓ Question · Pregunta
description: Ask how to do something with IP Switch · Pregunta cómo hacer algo con IP Switch
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Please check the [README](https://github.com/magancete/IP-Switch#readme) first, especially *Troubleshooting*.
        Revisa antes el [README en español](https://github.com/magancete/IP-Switch/blob/master/README.es.md), sobre todo *Solución de problemas*.

  - type: textarea
    id: question
    attributes:
      label: Question · Pregunta
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: IP Switch version and Windows · Versión de IP Switch y Windows
      placeholder: "IP Switch 1.0.0 · Windows 11 Pro 24H2"
