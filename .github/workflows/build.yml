# Build, validation and publishing of IP Switch.
#
# - On every push / pull request to master: checks resources, builds (0 warnings), runs the unit
#   tests and uploads IPSwitch.exe as an artifact.
# - When a vX.Y.Z tag is pushed: also attaches the executable and its SHA-256 to the GitHub release
#   (creating the release if it does not exist yet).
#
# Code signing (optional): if the CODE_SIGNING_PFX (Base64 .pfx certificate) and CODE_SIGNING_PASSWORD
# secrets exist, the executable is signed with signtool before publishing. Otherwise it is skipped.

name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      HAS_SIGNING_CERT: ${{ secrets.CODE_SIGNING_PFX != '' }}
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore IPSwitch.slnx

      - name: Check resources (localization keys and icons)
        shell: pwsh
        run: ./tools/Check-Resources.ps1

      - name: Build
        run: dotnet build src/IPSwitch/IPSwitch.csproj -c Release --no-restore -warnaserror

      - name: Unit tests
        run: dotnet test tests/IPSwitch.Tests/IPSwitch.Tests.csproj -c Release --no-restore --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      - name: Sign executable (optional)
        if: env.HAS_SIGNING_CERT == 'true'
        shell: pwsh
        env:
          CODE_SIGNING_PFX: ${{ secrets.CODE_SIGNING_PFX }}
          CODE_SIGNING_PASSWORD: ${{ secrets.CODE_SIGNING_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODE_SIGNING_PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object FullName -match 'x64' | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f $pfx /p $env:CODE_SIGNING_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "src/IPSwitch/bin/Release/net48/IPSwitch.exe"
          Remove-Item $pfx

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item src/IPSwitch/bin/Release/net48/IPSwitch.exe artifacts/IPSwitch.exe
          $hash = (Get-FileHash artifacts/IPSwitch.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content artifacts/IPSwitch.exe.sha256 "$hash  IPSwitch.exe" -Encoding ASCII

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: IPSwitch
          path: artifacts/

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/IPSwitch.exe
            artifacts/IPSwitch.exe.sha256
